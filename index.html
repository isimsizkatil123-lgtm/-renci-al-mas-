<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkılMentor - AI Çalışma Koçu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <h1>🎯 AkılMentor</h1>
            <p>AI Destekli Kişisel Çalışma Koçun</p>
        </header>

        <!-- PROFİL BÖLÜMÜ -->
        <section class="profile-section">
            <h2>👤 Öğrenci Profili</h2>
            <div class="profile-form">
                <select id="examType">
                    <option value="lgs">LGS</option>
                    <option value="yks">YKS</option>
                    <option value="dgs">DGS</option>
                </select>
                <input type="number" id="studyHours" placeholder="Günlük çalışma saati" min="1" max="8">
                <button onclick="saveProfile()">Profili Kaydet</button>
            </div>
        </section>

        <!-- AI PLAN BÖLÜMÜ -->
        <section class="ai-plan-section">
            <h2>🤖 AI Çalışma Planı</h2>
            <div id="dailyPlan" class="plan-container">
                <p>Planınız burada görünecek...</p>
            </div>
            <button onclick="generatePlan()" class="generate-btn">Plan Oluştur</button>
        </section>

        <!-- PERFORMANS TAKİP -->
        <section class="performance-section">
            <h2>📊 Performans Analizim</h2>
            <div class="chart-container">
                <canvas id="performanceChart"></canvas>
            </div>
        </section>
    </div>

    <script src="js/ai-coach.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
