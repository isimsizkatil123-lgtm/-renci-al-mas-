<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CrissAI - Giriş</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h1>🧠 CrissAI</h1>
            <p>Akıllı Asistanınıza Hoş Geldiniz</p>
        </div>

        <!-- GİRİŞ FORM -->
        <div class="login-form" id="loginForm">
            <h2>Giriş Yap</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Kullanıcı adı" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Şifre" required>
            </div>
            <button onclick="login()" class="login-btn">Giriş Yap</button>
            <p class="switch-form">
                Hesabın yok mu? <a href="#" onclick="showRegister()">Kayıt Ol</a>
            </p>
        </div>

        <!-- KAYIT FORM -->
        <div class="login-form" id="registerForm" style="display: none;">
            <h2>Kayıt Ol</h2>
            <div class="input-group">
                <input type="text" id="regUsername" placeholder="Kullanıcı adı" required>
            </div>
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="E-posta" required>
            </div>
            <div class="input-group">
                <input type="password" id="regPassword" placeholder="Şifre" required>
            </div>
            <div class="input-group">
                <input type="password" id="regPasswordConfirm" placeholder="Şifre Tekrar" required>
            </div>
            <button onclick="register()" class="login-btn">Kayıt Ol</button>
            <p class="switch-form">
                Hesabın var mı? <a href="#" onclick="showLogin()">Giriş Yap</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
